<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Library — Terakoya English Studio (TES)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Noto+Sans+JP:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <span class="brand-badge">TES</span>
        <span class="brand-text">
          <span class="brand-name">Terakoya English Studio</span>
          <span class="brand-sub">寺子屋イングリッシュスタジオ</span>
        </span>
      </a>

      <nav class="nav-links" id="nav-links">
        <a href="index.html" class="nav-link" data-i18n="nav_home">Home</a>
        <a href="homework.html" class="nav-link" data-i18n="nav_homework">Homework</a>
        <a href="worksheets.html" class="nav-link" data-i18n="nav_worksheets">Worksheets</a>
        <a href="videos.html" class="nav-link active" data-i18n="nav_videos">Videos</a>
      </nav>

      <div class="nav-actions">
        <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch Language">
          🌐 <span data-i18n="lang_btn">日本語</span>
        </button>
        <button id="menu-btn" class="menu-btn" type="button" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1 data-i18n="vid_header_title">TES Video Library</h1>
        <div id="yt-channel-wrap" style="margin-top: 16px;"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filter-bar">
          <button class="filter-btn active" type="button" data-vid-filter="all" data-i18n="vid_filter_all">All Videos</button>
          <button class="filter-btn" type="button" data-vid-filter="stories" data-i18n="vid_filter_stories">Story Series</button>
          <button class="filter-btn" type="button" data-vid-filter="diaries" data-i18n="vid_filter_diaries">Diaries</button>
          <button class="filter-btn" type="button" data-vid-filter="reading-power" data-i18n="vid_filter_reading">Reading Power</button>
        </div>

        <div id="videos-grid" class="grid-2"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span data-i18n="footer_copy">© Terakoya English Studio (TES).</span>
      <span>JHS 1–3 · HS 1–3 · Kids Thu / Fri</span>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
